# Optional: only needed if you deploy this worker with the Wrangler CLI
# instead of pasting orbit-worker.js into the Cloudflare dashboard's online
# editor (the dashboard route needs no CLI or local install at all - see
# README, which documents both paths for each feature).
#
# CLI path:
#   npx wrangler login
#   npx wrangler deploy
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY
#   npx wrangler kv namespace create RATE_LIMIT_KV
#     (then uncomment the [[kv_namespaces]] block below with the printed id)
#
# CI path (.github/workflows/deploy-worker.yml deploys this file with
# Wrangler on every push to main that touches cloudflare-worker/**): a
# `wrangler deploy` pushes THIS FILE's [vars]/[[kv_namespaces]] as the
# worker's whole config, replacing whatever's live on Cloudflare - it does
# not merge with dashboard-made changes. Before ever relying on that
# workflow, fill in the real values below (FIREBASE_PROJECT_ID, and the
# kv_namespaces block if you use RATE_LIMIT_KV) to match what's already
# live, or the first automated deploy will overwrite them with the
# placeholders below. Secrets (GEMINI_API_KEY etc., set via `wrangler
# secret put` or the dashboard) are stored separately and are NOT touched
# by a plain `wrangler deploy` - only [vars] and bindings live here.
name = "orbit-workers-proxy"
# ^ Must match the Worker's actual name in the Cloudflare dashboard exactly -
# `wrangler deploy` targets whatever's named here, and a mismatch silently
# creates/updates an unrelated second Worker instead of erroring. Confirmed
# against the real deployed URL (see PROXY_URL) rather than assumed from the
# filename - orbit-worker.js is just this repo's source file name, not
# necessarily the deployed Worker's name.
main = "orbit-worker.js"
compatibility_date = "2025-01-01"

# Smart Placement: without this, Cloudflare runs each request's Worker
# isolate at whichever edge colo is nearest the calling browser, so /gemini's
# one outbound fetch (to generativelanguage.googleapis.com) also originates
# from that colo's egress IP. Some of Cloudflare's colos geolocate to
# countries/territories Google's Gemini API refuses outright ("User location
# is not supported for the API use", a plain 400 - see
# AIVisionProcessor.callGemini's handling of it in src/gemini-ocr.js), so a
# user whose traffic happens to route through one of those colos hits this
# error even though their own real location is fully supported. "smart" asks
# Cloudflare to instead place the isolate near wherever the Worker's own
# subrequests actually go (here, effectively a stable region close to
# Google's endpoint) - it does not name a specific region, but it aims this
# Worker at the backend it talks to instead of the client that happened to
# call it, which is exactly what this route needs since talking to Gemini is
# its only real work. Dashboard-only deploys (no wrangler) get the same
# effect from that Worker's Settings -> Placement -> "Smart" toggle - this
# comment is the reason to turn it on there.
[placement]
mode = "smart"

# Only needed for the /sync path (see orbit-worker.js's handleSyncRequest).
# Not a secret on its own - it's already public today in the no-proxy
# fallback path (VITE_ORBIT_SYNC_PROJECT_ID ships inside the client JS
# bundle) - kept as a plain var here so it's easy to see/change in the
# dashboard without needing "reveal secret".
[vars]
FIREBASE_PROJECT_ID = "orbit-project-76897"

# GEMINI_API_KEY (for /gemini) and FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY
# (for /sync, from Firebase Console -> Project Settings -> Service accounts
# -> Generate new private key) are set as Secrets, not [vars] - see the CLI
# commands above, or the dashboard's Settings -> Variables and Secrets.
# Treat the Firebase service-account key like a password: it grants full
# read/write access to that Firebase project, bypassing Firestore Security
# Rules entirely (that's the whole point - see orbit-worker.js's /sync
# comment). Either feature works independently of the other being
# configured - see orbit-worker.js's top-of-file comment.

# Optional but recommended: a real, cross-request rate limit instead of the
# in-memory per-isolate fallback the worker uses when this isn't bound - see
# orbit-worker.js's isRateLimited(). Shared by both /gemini and /sync (their
# keys are prefixed per-feature and never collide). Free on Cloudflare's
# Workers KV free tier (no billing account needed). Dashboard path: Workers
# & Pages -> KV -> Create namespace -> name it anything -> back on this
# Worker's Settings -> Bindings -> Add -> KV Namespace -> variable name
# RATE_LIMIT_KV -> pick the namespace you just created.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8b24d75fbe0a4a69aef0f35cb7a8d847"

# Optional second deployment of the SAME orbit-worker.js, with Smart
# Placement deliberately left OFF (no [placement] block here - Cloudflare's
# default nearest-to-caller routing). Exists purely so the location-block
# retry in gemini-ocr.js/editor-nl-edit.js has a genuinely different colo to
# try: Smart Placement above sticks a given caller to whichever colo it
# judged optimal for reaching Google, so a plain retry against the primary
# Worker tends to land on that same stuck colo again if THAT'S the one
# Google blocks for this caller (see [placement]'s own comment above, and
# src/proxy-config.js's proxyFallbackPath). `wrangler deploy --env fallback`
# deploys this as its own separate Worker (its name below), independent of
# the primary one - it needs its OWN secrets too:
#   npx wrangler secret put GEMINI_API_KEY --env fallback
# (only GEMINI_API_KEY - this env only ever serves /gemini and /nl-edit
# retries, never /sync, so the Firebase secrets aren't needed here).
# Entirely optional: with PROXY_URL_FALLBACK left unset in GitHub Actions
# Variables, callers just retry the primary Worker again instead - a real
# but weaker mitigation, not a broken one - so skipping this whole section
# is a legitimate choice, not a half-finished setup.
[env.fallback]
name = "orbit-workers-proxy-fallback"
main = "orbit-worker.js"
compatibility_date = "2025-01-01"

[env.fallback.vars]
FIREBASE_PROJECT_ID = "orbit-project-76897"

[[env.fallback.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8b24d75fbe0a4a69aef0f35cb7a8d847"
